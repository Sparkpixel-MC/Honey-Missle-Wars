name: Build and Release Honey-Missle-Wars

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build-Main:
    name: Build Main Plugin
    runs-on: ubuntu-latest
    outputs:
      Jar_Name: ${{ steps.Find_Jar.outputs.Jar_Name }}
      Version: ${{ steps.Get_Version.outputs.Version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Get Version from Gradle
        id: Get_Version
        run: |
          set -e
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}' | head -n1)
          VERSION=${VERSION#v}
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from Gradle" >&2
            exit 1
          fi
          echo "Version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build Main Plugin
        run: ./gradlew build

      - name: Locate Main JAR
        id: Find_Jar
        run: |
          set -e
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' 2>/dev/null | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No JAR found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "Jar_Path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Jar_Name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Selected main JAR: $JAR"

      - name: Upload Main Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Honey-Missle-Wars-Main
          path: ${{ steps.Find_Jar.outputs.Jar_Path }}
          if-no-files-found: error

  Build-Lobby:
    name: Build Lobby Adapter
    runs-on: ubuntu-latest
    outputs:
      Jar_Name: ${{ steps.Find_Jar.outputs.Jar_Name }}
      Version: ${{ steps.Get_Version.outputs.Version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Get Version from Gradle
        id: Get_Version
        run: |
          set -e
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}' | head -n1)
          VERSION=${VERSION#v}
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from Gradle" >&2
            exit 1
          fi
          echo "Version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build Lobby Adapter
        run: ./gradlew :hmw-lobby:build

      - name: Locate Lobby JAR
        id: Find_Jar
        run: |
          set -e
          JAR=$(find hmw-lobby/build/libs -maxdepth 1 -type f -name '*.jar' 2>/dev/null | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No JAR found in hmw-lobby/build/libs" >&2
            ls -la hmw-lobby/build/libs || true
            exit 1
          fi
          echo "Jar_Path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Jar_Name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Selected lobby JAR: $JAR"

      - name: Upload Lobby Adapter Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Honey-Missle-Wars-Lobby
          path: ${{ steps.Find_Jar.outputs.Jar_Path }}
          if-no-files-found: error

  Release-Main:
    name: Publish Main Release
    needs: Build-Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Main Artifact
        uses: actions/download-artifact@v4
        with:
          name: Honey-Missle-Wars-Main
          path: Release-Assets/Main

      - name: List Main Release Assets
        run: |
          find Release-Assets/Main -type f | sort

      - name: Publish Main Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.Build-Main.outputs.Version }}
          name: Honey-Missle-Wars v${{ needs.Build-Main.outputs.Version }}
          prerelease: false
          allowUpdates: true
          makeLatest: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          artifacts: Release-Assets/Main/*.jar
          body: |
            ## 🚀 Honey-Missle-Wars v${{ needs.Build-Main.outputs.Version }}

            Automated build triggered by commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on `${{ github.ref_name }}`.

            ### 📦 Included Artifacts
            - **Main Plugin JAR**: `${{ needs.Build-Main.outputs.Jar_Name }}`

            ### 🛠️ Installation
            1. Download the JAR from the assets below.
            2. Place it into your server's `plugins/` folder.
            3. Restart your server.

            ### 📝 Changelog
            The full changelog is auto-generated below. 👇

            ---
            _If you encounter any issues, please open an Issue and include your environment, modules, logs, config snippets, and reproduction steps._
          generateReleaseNotes: true

  Release-Lobby:
    name: Publish Lobby Release
    needs: Build-Lobby
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Lobby Artifact
        uses: actions/download-artifact@v4
        with:
          name: Honey-Missle-Wars-Lobby
          path: Release-Assets/Lobby

      - name: List Lobby Release Assets
        run: |
          find Release-Assets/Lobby -type f | sort

      - name: Publish Lobby Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: lobby-v${{ needs.Build-Lobby.outputs.Version }}
          name: Honey-Missle-Wars Lobby Adapter v${{ needs.Build-Lobby.outputs.Version }}
          prerelease: false
          allowUpdates: true
          makeLatest: false
          artifactErrorsFailBuild: true
          removeArtifacts: true
          artifacts: Release-Assets/Lobby/*.jar
          body: |
            ## 🧩 Honey-Missle-Wars Lobby Adapter v${{ needs.Build-Lobby.outputs.Version }}

            Automated build triggered by commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on `${{ github.ref_name }}`.

            This is the **BungeeCord Lobby Adapter** for Honey-Missle-Wars.

            ### 📦 Included Artifacts
            - **Lobby Adapter JAR**: `${{ needs.Build-Lobby.outputs.Jar_Name }}`

            ### 🛠️ Installation
            1. Download the JAR from the assets below.
            2. Place it into your BungeeCord / Lobby server's `plugins/` folder.
            3. Restart the server.

            ### 📝 Changelog
            The full changelog is auto-generated below. 👇

            ---
            _If you encounter any issues, please open an Issue and include your environment, modules, logs, config snippets, and reproduction steps._
          generateReleaseNotes: true